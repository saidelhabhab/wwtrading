server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: quotation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${QUOTATION_DB_URL:jdbc:postgresql://quotation-db:5432/wwtrading_quotations}
    username: ${QUOTATION_DB_USERNAME:wwtrading_quotations}
    password: ${QUOTATION_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    connect-retries: 30
    connect-retries-interval: 2
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

wwtrading:
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/wwtrading}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:wwtrading-api}
  notifications:
    quotation:
      from: ${QUOTATION_MAIL_FROM:wwtrading.morocco@gmail.com}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}


