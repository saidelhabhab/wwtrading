spring:
  datasource:
    url: ${MAINTENANCE_DB_URL:jdbc:postgresql://localhost:5439/wwtrading_maintenance}
    username: ${MAINTENANCE_DB_USERNAME:wwtrading_maintenance}
    password: ${MAINTENANCE_DB_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

wwtrading:
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/wwtrading}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/wwtrading/protocol/openid-connect/certs}
