spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
wwtrading:
  internal:
    notification-key: ${NOTIFICATION_INTERNAL_KEY:}
  security:
    audience: ${JWT_AUDIENCE:wwtrading-api}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:wwtrading}
    client-id: ${KEYCLOAK_CLIENT_ID:user-service-client}
    client-secret: ${USER_SERVICE_KEYCLOAK_CLIENT_SECRET:wwtrading-user-service-dev-secret}
