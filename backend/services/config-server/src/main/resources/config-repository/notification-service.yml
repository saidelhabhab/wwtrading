spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:3000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

wwtrading:
  internal:
    notification-key: ${NOTIFICATION_INTERNAL_KEY:}
  mail:
    from: ${MAIL_FROM:no-reply@wwtrading.ma}
    from-name: ${MAIL_FROM_NAME:WWTRADING}
  app-base-url: ${TRACKING_BASE_URL:${FRONTEND_PUBLIC_URL:${APP_BASE_URL:http://localhost:4201}}}
  security:
    audience: ${JWT_AUDIENCE:wwtrading-api}

notification:
  email:
    dispatch-enabled: ${NOTIFICATION_EMAIL_DISPATCH_ENABLED:true}
    dispatch-delay-ms: ${NOTIFICATION_EMAIL_DISPATCH_DELAY_MS:5000}
    batch-size: ${NOTIFICATION_EMAIL_BATCH_SIZE:20}
    max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
    retry-delay: ${NOTIFICATION_EMAIL_RETRY_DELAY:PT30S}
  whatsapp:
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}
    dispatch-enabled: ${NOTIFICATION_WHATSAPP_DISPATCH_ENABLED:true}
    dispatch-delay-ms: ${NOTIFICATION_WHATSAPP_DISPATCH_DELAY_MS:5000}
    batch-size: ${NOTIFICATION_WHATSAPP_BATCH_SIZE:20}
    max-attempts: ${NOTIFICATION_WHATSAPP_MAX_ATTEMPTS:3}
    retry-delay: ${NOTIFICATION_WHATSAPP_RETRY_DELAY:PT60S}
    api-base-url: ${NOTIFICATION_WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
    phone-number-id: ${NOTIFICATION_WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${NOTIFICATION_WHATSAPP_ACCESS_TOKEN:}
    default-country-code: ${NOTIFICATION_WHATSAPP_DEFAULT_COUNTRY_CODE:+212}
