spring:
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://notification-db:5432/wwtrading_notifications}
    username: ${NOTIFICATION_DB_USERNAME:wwtrading_notifications}
    password: ${NOTIFICATION_DB_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}

wwtrading:
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/wwtrading}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs}
