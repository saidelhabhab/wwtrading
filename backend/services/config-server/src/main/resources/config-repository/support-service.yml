spring:
  servlet:
    multipart:
      max-file-size: ${SUPPORT_ATTACHMENT_MAX_SIZE:10MB}
      max-request-size: ${SUPPORT_ATTACHMENT_MAX_REQUEST_SIZE:11MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

wwtrading:
  security:
    audience: ${JWT_AUDIENCE:wwtrading-api}

support:
  attachment:
    max-size: ${SUPPORT_ATTACHMENT_MAX_SIZE:10MB}
    storage:
      path: ${SUPPORT_ATTACHMENT_STORAGE_PATH:${java.io.tmpdir}/wwtrading/support-attachments}
