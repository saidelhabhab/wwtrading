server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users, /api/v1/users/**, /api/v1/clients, /api/v1/clients/**, /api/v1/auth, /api/v1/auth/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products, /api/products/**
            - id: stock
              uri: lb://product-service
              predicates:
                - Path=/api/stock, /api/stock/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders, /api/orders/**, /api/admin/payment-banks, /api/admin/payment-banks/**, /api/admin/delivery-settings, /api/admin/delivery-settings/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory, /api/inventory/**
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart, /api/cart/**
            - id: wishlist-service
              uri: lb://wishlist-service
              predicates:
                - Path=/api/wishlist, /api/wishlist/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications, /api/notifications/**
            - id: quotation-service
              uri: lb://quotation-service
              predicates:
                - Path=/api/quotations, /api/quotations/**
            - id: maintenance-service
              uri: lb://maintenance-service
              predicates:
                - Path=/api/maintenance, /api/maintenance/**
            - id: support-service
              uri: lb://support-service
              predicates:
                - Path=/api/support, /api/support/**
            - id: prospects
              uri: lb://quotation-service
              predicates:
                - Path=/api/prospects, /api/prospects/**
            - id: commercial-reports
              uri: lb://quotation-service
              predicates:
                - Path=/api/reports/commercial, /api/reports/commercial/**
            - id: order-analytics
              uri: lb://order-service
              predicates:
                - Path=/api/analytics/orders
            - id: quotation-analytics
              uri: lb://quotation-service
              predicates:
                - Path=/api/analytics/quotations
            - id: maintenance-analytics
              uri: lb://maintenance-service
              predicates:
                - Path=/api/analytics/maintenance
            - id: client-analytics
              uri: lb://user-service
              predicates:
                - Path=/api/analytics/clients
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/wwtrading}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/wwtrading/protocol/openid-connect/certs}
  http:
    codecs:
      max-in-memory-size: 2MB

wwtrading:
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/wwtrading}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/wwtrading/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:wwtrading-api}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
