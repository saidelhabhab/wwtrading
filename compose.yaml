name: wwtrading

x-maven-service-build: &maven-service-build
  context: ./backend
  dockerfile: Dockerfile.service

services:
  keycloak-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_STRICT: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      USER_SERVICE_KEYCLOAK_CLIENT_SECRET: ${USER_SERVICE_KEYCLOAK_CLIENT_SECRET:-wwtrading-user-service-dev-secret}
    ports:
      - "8180:8080"
    volumes:
    - ./infrastructure/keycloak/wwtrading-realm.json:/opt/keycloak/data/import/wwtrading-realm.json:ro
    - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    - ./infrastructure/keycloak/providers:/opt/keycloak/providers:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [platform]

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.6.4
    entrypoint: ["/bin/bash", "/opt/config/apply-config.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_URL: http://keycloak:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
    - ./infrastructure/keycloak/apply-config.sh:/opt/config/apply-config.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  user-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_users
      POSTGRES_USER: wwtrading_users
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - user-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_users -d wwtrading_users"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5433:5432"

  maintenance-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_maintenance
      POSTGRES_USER: wwtrading_maintenance
      POSTGRES_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Set MAINTENANCE_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - maintenance-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_maintenance -d wwtrading_maintenance"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5439:5432"

  support-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_support
      POSTGRES_USER: wwtrading_support
      POSTGRES_PASSWORD: ${SUPPORT_DB_PASSWORD:?Set SUPPORT_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - support-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_support -d wwtrading_support"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5440:5432"

  notification-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_notifications
      POSTGRES_USER: wwtrading_notifications
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - notification-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_notifications -d wwtrading_notifications"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5441:5432"

  quotation-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_quotations
      POSTGRES_USER: wwtrading_quotations
      POSTGRES_PASSWORD: ${QUOTATION_DB_PASSWORD:?Set QUOTATION_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - quotation-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_quotations -d wwtrading_quotations"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5434:5432"

  order-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_orders
      POSTGRES_USER: wwtrading_orders
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - order-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_orders -d wwtrading_orders"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5435:5432"

  cart-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_carts
      POSTGRES_USER: wwtrading_carts
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD:?Set CART_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - cart-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_carts -d wwtrading_carts"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5436:5432"

  wishlist-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_wishlists
      POSTGRES_USER: wwtrading_wishlists
      POSTGRES_PASSWORD: ${WISHLIST_DB_PASSWORD:?Set WISHLIST_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - wishlist-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_wishlists -d wwtrading_wishlists"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5437:5432"

  product-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wwtrading_products
      POSTGRES_USER: wwtrading_products
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
      ENABLE_BACKUP_RESTORE: ${ENABLE_BACKUP_RESTORE:-false}
      BACKUP_RESTORE_MODE: ${BACKUP_RESTORE_MODE:-initial-empty-database}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    volumes:
      - product-data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups:ro
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwtrading_products -d wwtrading_products"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    ports:
      - "5438:5432"

  product-images-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /app/data/product-images/products
        chown -R 10001:10001 /app/data/product-images
    volumes:
      - product-images-data:/app/data/product-images
    networks: [platform]

  maintenance-attachments-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /app/data/maintenance-attachments/maintenance
        chown -R 10001:10001 /app/data/maintenance-attachments
    volumes:
      - maintenance-attachments-data:/app/data/maintenance-attachments
    networks: [platform]

  support-attachments-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /app/data/support-attachments/conversations
        chown -R 10001:10001 /app/data/support-attachments
    volumes:
      - support-attachments-data:/app/data/support-attachments
    networks: [platform]

  order-transfer-proofs-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /app/data/order-transfer-proofs/orders
        chown -R 10001:10001 /app/data/order-transfer-proofs
    volumes:
      - order-transfer-proofs-data:/app/data/order-transfer-proofs
    networks: [platform]

  discovery-server:
    image: wwtrading-discovery-server:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/discovery-server
    ports:
      - "8761:8761"
    networks: [platform]

  config-server:
    image: wwtrading-config-server:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/config-server
    depends_on:
      discovery-server:
        condition: service_started
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
      EUREKA_URL: http://discovery-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: native
    networks:
      - platform
    ports:
      - "8888:8888"
    volumes:
      - ./backend/services/config-server/src/main/resources/config-repository:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    image: wwtrading-api-gateway:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_ISSUER_URI: http://localhost:8180/realms/wwtrading
      JWT_JWK_SET_URI: http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs
      JWT_AUDIENCE: wwtrading-api
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4201}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-${FRONTEND_PUBLIC_URL:-http://localhost:4201}}
      SPRING_PROFILES_ACTIVE: docker
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4201}
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [platform]

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [platform]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: wwtrading-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - platform

  user-service:
    image: wwtrading-user-service:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      USER_DB_URL: jdbc:postgresql://user-db:5432/wwtrading_users
      USER_DB_USERNAME: wwtrading_users
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      JWT_ISSUER_URI: http://localhost:8180/realms/wwtrading
      JWT_JWK_SET_URI: http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs
      JWT_AUDIENCE: wwtrading-api
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: wwtrading
      KEYCLOAK_CLIENT_ID: user-service-client
      USER_SERVICE_KEYCLOAK_CLIENT_SECRET: ${USER_SERVICE_KEYCLOAK_CLIENT_SECRET:-wwtrading-user-service-dev-secret}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?Set NOTIFICATION_INTERNAL_KEY in .env}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [platform]

  maintenance-service:
    image: wwtrading-maintenance-service:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/maintenance-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MAINTENANCE_DB_URL: jdbc:postgresql://maintenance-db:5432/wwtrading_maintenance
      MAINTENANCE_DB_USERNAME: wwtrading_maintenance
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Set MAINTENANCE_DB_PASSWORD in .env}
      MAINTENANCE_ATTACHMENT_STORAGE_PATH: /app/data/maintenance-attachments
      JWT_ISSUER_URI: http://localhost:8180/realms/wwtrading
      JWT_JWK_SET_URI: http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs
      JWT_AUDIENCE: wwtrading-api
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4201}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-${FRONTEND_PUBLIC_URL:-http://localhost:4201}}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8087:8087"
    volumes:
      - maintenance-attachments-data:/app/data/maintenance-attachments
    depends_on:
      maintenance-attachments-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      maintenance-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [platform]

  support-service:
    image: wwtrading-support-service:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/support-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      SUPPORT_DB_URL: jdbc:postgresql://support-db:5432/wwtrading_support
      SUPPORT_DB_USERNAME: wwtrading_support
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?Set SUPPORT_DB_PASSWORD in .env}
      SUPPORT_ATTACHMENT_STORAGE_PATH: /app/data/support-attachments
      JWT_ISSUER_URI: http://localhost:8180/realms/wwtrading
      JWT_JWK_SET_URI: http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs
      JWT_AUDIENCE: wwtrading-api
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4201}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-${FRONTEND_PUBLIC_URL:-http://localhost:4201}}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8088"
    volumes:
      - support-attachments-data:/app/data/support-attachments
    depends_on:
      support-attachments-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      support-db:
        condition: service_healthy
      user-service:
        condition: service_started
      keycloak:
        condition: service_started
    networks: [platform]

  notification-service:
    image: wwtrading-notification-service:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/notification-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/wwtrading_notifications
      NOTIFICATION_DB_USERNAME: wwtrading_notifications
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      JWT_ISSUER_URI: http://localhost:8180/realms/wwtrading
      JWT_JWK_SET_URI: http://keycloak:8080/realms/wwtrading/protocol/openid-connect/certs
      JWT_AUDIENCE: wwtrading-api
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4201}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-${FRONTEND_PUBLIC_URL:-http://localhost:4201}}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?Set NOTIFICATION_INTERNAL_KEY in .env}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8089:8089"
    depends_on:
      config-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8089/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [platform]

  quotation-service:
    image: wwtrading-quotation-service:latest
    build:
      <<: *maven-service-build
      args:
        SERVICE_PATH: services/quotation-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
