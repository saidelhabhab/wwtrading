# 20. EXECUTION RULE — VERY IMPORTANT

For EVERY user request:

### STEP 1 — IDENTIFY CURRENT PHASE

Determine:

* requested phase
* current repository state
* existing implementation
* missing requirements

Do not assume that the phase is complete because some files already exist.

---

### STEP 2 — PHASE AUDIT

Before modifying code, compare:

**Required phase → Existing implementation → Missing items**

Inspect only the relevant files.

Classify each requirement:

* `DONE`
* `PARTIAL`
* `MISSING`
* `BLOCKED`

---

### STEP 3 — COMPLETE CURRENT PHASE

If the requested phase is `PARTIAL` or `MISSING`:

**implement the missing parts first.**

Do NOT move to the next phase.

If the phase is already complete, verify it and continue only if the user explicitly requested the next phase.

---

### STEP 4 — MICRO PLAN

Before implementation, provide only:

* Goal
* Files likely affected
* Maximum expected file count
* Verification
* Blocker, if any

Keep it concise.

---

### STEP 5 — IMPLEMENT

Apply the smallest production-safe change.

Follow existing project conventions.

Do not introduce unnecessary abstractions.

---

### STEP 6 — VERIFY

Use the cheapest useful verification:

1. compile/type-check
2. targeted unit test
3. targeted integration test if required
4. broader verification only when necessary

Do NOT automatically run:

* entire backend
* entire frontend
* all services
* full Docker stack
* Kubernetes
* Kafka
* complete security suite

unless required by the current phase checkpoint.

---

# 21. PHASE GATE — MANDATORY

A phase is NOT complete until:

* all phase requirements are implemented
* no known phase-critical blocker remains
* relevant tests pass
* relevant build/type-check passes
* security requirements for the phase are verified
* affected documentation is updated
* no future-phase implementation was accidentally introduced

Then mark:

`PHASE STATUS: COMPLETE`

If anything remains:

`PHASE STATUS: INCOMPLETE`

and continue working on the current phase rather than moving forward.

---

# 22. IMPORTANT CONTINUATION RULE

**DO NOT STOP AFTER PARTIAL IMPLEMENTATION.**

If the current phase has remaining work that can be safely completed from the repository:

→ complete it.

Do not say:

> "Phase complete"

when requirements are still missing.

Do not ask for approval merely because additional files must be modified if those files are clearly required to complete the current phase.

Only stop when:

1. the phase is complete, OR
2. a real blocker requires user input, OR
3. continuing would require entering a future phase.

---

# 23. FUTURE-PHASE PROTECTION

Never implement future phases automatically.

If completing the current phase reveals a dependency on a future phase:

* implement only the minimum contract/interface required
* document the dependency
* do not implement the future business functionality

Example:

If Product Service needs an event contract that belongs to a later Kafka phase:

→ create only the minimum required contract if necessary.

Do NOT build the entire Kafka event system.

