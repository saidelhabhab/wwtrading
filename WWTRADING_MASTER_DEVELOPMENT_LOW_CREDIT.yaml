# 6. API SECURITY

Implemented services should use, where applicable:

* CORS whitelist
* JWT validation
* issuer validation
* audience validation
* RBAC
* DTO validation
* secure headers
* request size limits
* pagination
* sorting whitelist
* filtering validation
* rate limiting
* correlation IDs
* safe global exception handling

Never expose:

* stack traces
* database errors
* internal URLs
* secrets
* tokens

Use HTTPS-ready configuration.

For stateless APIs, apply an appropriate CSRF strategy rather than blindly disabling security.

