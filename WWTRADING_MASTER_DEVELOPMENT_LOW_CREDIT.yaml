# 18. TOKEN / COMPUTE OPTIMIZATION

This is mandatory.

## Repository inspection

Do NOT scan the whole repository by default.

Inspect only:

* files directly related to the current task
* direct dependencies
* required configuration

Prefer targeted searches by:

* filename
* class
* symbol
* endpoint
* package
* configuration key

Avoid repeatedly reading the same files.

## Changes

Make the smallest safe patch.

Do not:

* refactor unrelated code
* rename unrelated code
* reformat unrelated files
* regenerate working code
* create future components
* duplicate existing abstractions

Preferred limits:

* small task: ≤8 files inspected
* small task: ≤5 files modified

If more than 8 files need inspection, inspect in batches.

If more than 5 files need modification, split the work unless atomic correctness requires them together.

If a task appears to require >12 modified files:

**STOP and propose a sub-phase split before implementation.**

