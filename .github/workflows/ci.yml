name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend Build & Tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    name: Frontend Build & Checks (Angular 19 / Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  filesystem-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Security Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/root/src aquasec/trivy:latest fs \
            --format sarif \
            --output /root/src/trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            /root/src
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  docker-validation:
    name: Docker Configuration & Frontend Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Frontend Docker Image Build
        run: |
          docker build -t wwtrading/frontend:validation ./frontend

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [secret-scan, backend, frontend, filesystem-scan, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Execute Deployment on Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          fingerprint: "SHA256:f6EiD3A1BO29C+IQoXI0LnFkx4Lzz5ZnovytaQs1J5g"
          script_stop: true
          script: |
            mkdir -p ~/wwtrading
            cd ~/wwtrading
            if [ ! -d .git ]; then
              git clone https://github.com/saidelhabhab/wwtrading.git .
            else
              git fetch origin
              git checkout main
              git reset --hard origin/main
            fi
            chmod +x scripts/deploy-azure-vm.sh
            ./scripts/deploy-azure-vm.sh
